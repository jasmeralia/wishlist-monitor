[tool.mypy]
check_untyped_defs = true

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 25
max-branches = 20
max-statements = 80
max-returns = 8
