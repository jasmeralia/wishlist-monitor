[project]
# Runtime dependencies for native TrueNAS cron + uv (Odoo #467). requirements.txt
# remains the source of truth for the Docker image build; keep both in sync.
name = "wishlist-monitor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pytz",
    "tenacity",
    "python-dotenv",
    "Jinja2",
]

[tool.uv]
package = false

[tool.mypy]
check_untyped_defs = true

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 25
max-branches = 20
max-statements = 80
max-returns = 8
